    width: 100%;

    border: 2px solid #e0e0e0;

    display: inline-block;
    width: 100%;

    <div class="progress-bar"><div class="progress-fill" style="width:33%"></div></div>
    <label>點選今天最像你的天氣</label>
    <div class="grid-2" id="moodGrid"></div>
    <button class="btn btn-ghost" onclick="backToSeat()" style="margin-top:12px;">← 返回</button>
  </div>

  <!-- Step 3: 強度與語句 -->
  <div id="step-detail" class="card hidden">
    <div class="progress-bar"><div class="progress-fill" style="width:66%"></div></div>
    <label>這個感覺有多強呢？</label>
    <div class="grid-3" id="levelGrid"></div>

    <select id="noteSelect" style="margin-bottom:10px;">
      <option value="">選一句話，或自己寫</option>
    </select>
    <textarea id="noteCustom" rows="2" placeholder="也可以自己寫...（例如：因為今天有體育課！）"></textarea>

    <button class="btn" onclick="submitMood()" id="submitBtn">完成登錄 ✨</button>
    <button class="btn btn-ghost" onclick="backToMood()" style="margin-top:8px;">← 返回</button>
  </div>

  <!-- Step 4: AI 回應與建議 -->
  <div id="step-result" class="card hidden">
    <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
    <div id="resultContent">
      <div class="loading">
        <div class="spinner"></div>
        <div>🪄 正在為你調製今日回應...</div>
      </div>
    </div>
  </div>

  <!-- Step 5: 完成 -->
  <div id="step-done" class="card hidden">
    <div style="text-align:center; padding: 20px 0;">
      <div class="emoji bounce" style="font-size:4rem;">🎉</div>
      <h2 style="color:#1565c0; margin:12px 0;">登錄完成！</h2>
      <p style="color:#555;">你今天已經完成心情登錄，超棒的！</p>
      <div id="todayBadge" class="badge"></div>
      <div style="margin-top:20px;">
        <button class="btn" onclick="resetAll()">再幫同學登錄</button>
        <button class="btn btn-secondary" onclick="showTodayBoard()" style="margin-top:10px;">看今日班級天氣圖</button>
      </div>
    </div>
  </div>

    <label>☁️ 今日班級心情天氣圖</label>
    <div id="boardContent" class="weather-summary"></div>
    <div style="margin-top:16px;">

    </div>
    <button class="btn btn-ghost" onclick="backToDone()" style="margin-top:12px;">← 返回</button>
  </div>

</div>

/* ================================

function apiGet(endpoint, onSuccess, onError) {
  try {
    var url = SUPABASE_URL + '/rest/v1/' + endpoint;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
    xhr.setRequestHeader('Accept', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (onSuccess) onSuccess(data);
          } catch (e) {
            if (onError) onError(e);
          }
        } else {
          if (onError) onError(new Error('HTTP ' + xhr.status));
        }
      }
    };
    xhr.onerror = function() {
      if (onError) onError(new Error('網路錯誤'));
    };
    xhr.send();
  } catch (e) {
    if (onError) onError(e);
  }
}

function apiPost(endpoint, body, onSuccess, onError) {
  try {
    var url = SUPABASE_URL + '/rest/v1/' + endpoint;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Prefer', 'return=minimal');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 201 || xhr.status === 200) {
          if (onSuccess) onSuccess();
        } else {
          if (onError) onError(new Error('HTTP ' + xhr.status + ': ' + xhr.responseText));
        }
      }
    };
    xhr.onerror = function() {
      if (onError) onError(new Error('網路錯誤'));
    };
    xhr.send(JSON.stringify(body));
  } catch (e) {
    if (onError) onError(e);
  }
}

/* ================================
   初始化
   ================================ */
function buildMoodGrid() {
  var grid = document.getElementById('moodGrid');
  if (!grid) return;
  grid.innerHTML = '';
  var keys = Object.keys(MOODS);
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var m = MOODS[key];
    var div = document.createElement('div');
    div.className = 'mood-btn';
    div.style.background = m.color;
    div.setAttribute('data-mood', key);
    div.innerHTML = '<div class="emoji">' + m.emoji + '</div><div class="name">' + m.name + '</div><div class="hint">' + m.desc + '</div>';
    div.onclick = function() { selectMood(this.getAttribute('data-mood'), this); };
    grid.appendChild(div);
  }
}

function buildLevelGrid() {
  var grid = document.getElementById('levelGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (var i = 0; i < LEVELS.length; i++) {
    var l = LEVELS[i];
    var div = document.createElement('div');
    div.className = 'level-btn';
    div.setAttribute('data-value', l.value);
    div.innerHTML = '<div style="font-size:1.4rem;">' + l.label + '</div><div style="font-size:0.85rem;color:#777;margin-top:2px;">' + l.desc + '</div>';
    div.onclick = function() { selectLevel(parseInt(this.getAttribute('data-value'), 10), this); };
    grid.appendChild(div);
  }
}

function initApp() {
  try {
    var saved = localStorage.getItem('moodSeat');
    if (saved) {
      document.getElementById('seatInput').value = saved;
    }
    buildMoodGrid();
    buildLevelGrid();
  } catch (e) {
    showError('初始化失敗：' + e.message);
    console.error(e);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

/* ================================

   ================================ */
function show(id) {
  try {
    var ids = ['step-seat','step-mood','step-detail','step-result','step-done','step-board'];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.classList.add('hidden');
    }
    var target = document.getElementById(id);
    if (target) target.classList.remove('hidden');
  } catch (e) {
    console.error('show() 錯誤:', e);
    alert('切換畫面時遇到問題，請重新整理頁面再試。');
  }
}

function goToMood() {
  try {
    var input = document.getElementById('seatInput');
    var val = parseInt(input.value, 10);
    if (!val || val < 1 || val > 99) {
      alert('請輸入 1~99 的座號喔！'); return;
    }
    currentSeat = val;
    try {
      localStorage.setItem('moodSeat', val);
    } catch (e2) {}
    show('step-mood');
  } catch (e) {
    alert('發生錯誤：' + e.message);
    console.error(e);
  }
}

function backToSeat() { show('step-seat'); }

function updateNoteOptions(mood) {
  var select = document.getElementById('noteSelect');
  if (!select) return;
  select.innerHTML = '<option value="">選一句話，或自己寫</option>';
  var opts = MOOD_OPTIONS[mood];
  if (!opts) return;
  for (var i = 0; i < opts.length; i++) {
    var o = opts[i];
    var opt = document.createElement('option');
    opt.value = o.value;
    opt.text = o.text;
    select.appendChild(opt);
  }
}

function selectMood(key, el) {
  currentMood = key;
  var buttons = document.querySelectorAll('.mood-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.remove('selected');
  }
  el.classList.add('selected');
  updateNoteOptions(key);
  setTimeout(function() { show('step-detail'); }, 250);
}

function backToMood() { show('step-mood'); }

function selectLevel(val, el) {
  currentLevel = val;
  var buttons = document.querySelectorAll('.level-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.remove('selected');
  }
  el.classList.add('selected');
}

/* ================================
   提交與回應
   ================================ */
function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateResponse(mood, level, note) {
  var t = RESPONSE_TEMPLATES[mood];
  var intro = pickRandom(t.intro);
  var body = pickRandom(t.body);
  var advice = pickRandom(t.advice);

  var levelText = '';
  if (level === 1) levelText = '雖然只有一點點，但我們都看到了。';
  if (level === 2) levelText = '這個感覺蠻明顯的，值得被好好對待。';
  if (level === 3) levelText = '這個感覺非常強烈，今天請特別照顧自己。';

  var noteText = '';
  if (note) noteText = '\n\n你說「' + note + '」，謝謝你願意說出來。';

  var response = intro + '\n\n' + body + ' ' + levelText + noteText + '\n\n🌟 記得：不管什麼天氣，你都是值得被愛的孩子。';
  return { response: response, advice: advice };
}

function submitMood() {
  if (!currentLevel) {
    alert('請選擇感覺有多強喔！'); return;
  }
  var noteSel = document.getElementById('noteSelect').value;
  var noteCustom = document.getElementById('noteCustom').value.trim();
  currentNote = noteCustom || noteSel || '';

  show('step-result');
  var resEl = document.getElementById('resultContent');
  resEl.innerHTML = '<div class="loading"><div class="spinner"></div><div>🪄 正在為你調製今日回應...</div></div>';

  var result = generateResponse(currentMood, currentLevel, currentNote);
  var response = result.response;
  var advice = result.advice;

  // 儲存到 Supabase
  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = ('0' + (today.getMonth() + 1)).slice(-2);
  var dd = ('0' + today.getDate()).slice(-2);
  var recordDate = yyyy + '-' + mm + '-' + dd;

  apiPost('mood_records', {
    seat_number: currentSeat,
    mood: currentMood,
    mood_level: currentLevel,
    note: currentNote || null,
    ai_response: response,
    advice: advice,
    record_date: recordDate
  }, function() {
    console.log('儲存成功');
  }, function(err) {
    console.error('儲存失敗', err);
    showError('儲存失敗：' + err.message);
  });

  var m = MOODS[currentMood];
  var badge = BADGES[currentMood];

  var html =
    '<div style="text-align:center; margin-bottom:12px;">' +
      '<div style="font-size:3.5rem;">' + m.emoji + '</div>' +
      '<div style="font-size:1.2rem; color:#555; margin-top:4px;">' + m.name + ' · ' + LEVELS[currentLevel-1].label + '</div>' +
    '</div>' +
    '<div class="response-box">' +
      '<div style="font-weight:700; color:#e65100; margin-bottom:6px;">💬 AI 的回應</div>' +
      '<div style="white-space:pre-line;">' + response.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
    '</div>' +
    '<div class="advice-box">' +
      '<div style="font-weight:700; color:#1565c0; margin-bottom:6px;">🧭 今天可以試試看</div>' +
      '<div>' + advice + '</div>' +
    '</div>' +
    '<div style="text-align:center; margin-top:16px;">' +
      '<div class="badge">' + badge + '</div>' +
    '</div>' +
    '<button class="btn" onclick="finish()" style="margin-top:20px;">完成 ✨</button>';

  resEl.innerHTML = html;
}

function finish() {
  document.getElementById('todayBadge').innerText = BADGES[currentMood];
  show('step-done');
}

function resetAll() {
  currentMood = null;
  currentLevel = null;
  currentNote = '';
  var mb = document.querySelectorAll('.mood-btn');
  for (var i = 0; i < mb.length; i++) mb[i].classList.remove('selected');
  var lb = document.querySelectorAll('.level-btn');
  for (var i = 0; i < lb.length; i++) lb[i].classList.remove('selected');
  document.getElementById('noteSelect').value = '';
  document.getElementById('noteCustom').value = '';
  show('step-seat');
}

/* ================================
   班級天氣圖
   ================================ */
function showTodayBoard() {
  show('step-board');
  var bc = document.getElementById('boardContent');
  var ht = document.getElementById('historyTable');
  bc.innerHTML = '<div style="color:#888;">正在載入...</div>';
  ht.innerHTML = '';

  var today = new Date();
  var yyyy = today.getFullYear();
  var mm = ('0' + (today.getMonth() + 1)).slice(-2);
  var dd = ('0' + today.getDate()).slice(-2);
  var recordDate = yyyy + '-' + mm + '-' + dd;

  apiGet(
    'mood_records?select=*&record_date=eq.' + recordDate + '&order=created_at.asc',
    function(data) {
      if (!data || data.length === 0) {
        bc.innerHTML = '<div style="color:#888;">今天還沒有人登錄心情喔，快來當第一個！</div>';
        ht.innerHTML = '';
        return;
      }

      var counts = {};
      for (var i = 0; i < data.length; i++) {
        var d = data[i];
        counts[d.mood] = (counts[d.mood] || 0) + 1;
      }
      bc.innerHTML = '';
      var countKeys = Object.keys(counts);
      for (var i = 0; i < countKeys.length; i++) {
        var k = countKeys[i];
        var c = counts[k];
        var m = MOODS[k];
        var chip = document.createElement('div');
        chip.className = 'weather-chip';
        chip.innerHTML = m.emoji + ' ' + m.name + ' <strong>' + c + '</strong> 人';
        bc.appendChild(chip);
      }

      var rows = '<tr><th>座號</th><th>天氣</th><th>強度</th><th>時間</th></tr>';
      for (var i = 0; i < data.length; i++) {
        var d = data[i];
        var m = MOODS[d.mood];
        var lv = LEVELS[(d.mood_level || 1) - 1].label;
        var t = new Date(d.created_at).toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
        rows += '<tr><td>' + d.seat_number + '</td><td>' + m.emoji + ' ' + m.name + '</td><td>' + lv + '</td><td>' + t + '</td></tr>';
      }
      ht.innerHTML = rows;
    },
    function(err) {
      console.error(err);
      bc.innerHTML = '<div style="color:#c62828;">載入失敗：' + (err.message || '未知錯誤') + '</div>';
    }
  );
}

function backToDone() {
  show('step-done');
}
